# Local PostgreSQL for the apps started manually on the host.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: persona_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: persona_user
      POSTGRES_PASSWORD: persona_pass
      POSTGRES_DB: persona_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona_user -d persona_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
